
services:
  postgres:
    image: postgres:16
    container_name: payme-postgres
    environment:
      POSTGRES_DB: payme
      POSTGRES_USER: payme
      POSTGRES_PASSWORD: payme
    ports:
      - "5432:5432"
    volumes:
      - payme_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: payme-redis
    ports:
      - "6379:6379"
    volumes:
      - payme_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  payme_pgdata:
  payme_redis_data:
